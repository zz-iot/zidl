name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          # Uncomment to add Intel macOS coverage (uses more CI minutes):
          # - name: macOS x86_64
          #   os: macos-13
          - name: Windows x86_64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"
          # setup-zig caches both the Zig toolchain and the global Zig cache
          # automatically; no separate actions/cache step is needed.

      # Format check is platform-independent; run once on Linux only.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: zig fmt --check src/ packages/ tools/ test/xrce-microzig/ test/golden/zig/ test/golden/zig-split/

      # ── Core tests ────────────────────────────────────────────────────────

      - name: Test (main)
        run: zig build test

      - name: Test (TSan)
        if: matrix.os == 'ubuntu-latest'
        run: zig build test -Dsanitize-thread

      - name: Test (zidl-rt)
        run: zig build test
        working-directory: packages/zidl-rt

      - name: Test (zidl-rt TSan)
        if: matrix.os == 'ubuntu-latest'
        run: zig build test -Dsanitize-thread
        working-directory: packages/zidl-rt

      - name: Test (zidl-cdr)
        run: zig build test
        working-directory: packages/zidl-cdr

      - name: Test (zidl-cdr TSan)
        if: matrix.os == 'ubuntu-latest'
        run: zig build test -Dsanitize-thread
        working-directory: packages/zidl-cdr

      # ── Integration tests ─────────────────────────────────────────────────
      # C and C++ use Zig's bundled clang/clang++; no external compiler needed.
      # Java requires javac/java; GitHub-hosted runners include a JDK on all
      # platforms.  If javac is not found, build.zig skips Java with a warning.

      - name: Integration tests
        run: zig build integration-test

      # ── Interop tests ─────────────────────────────────────────────────────
      # Expected CDR bytes are hardcoded in zig_interop_test.zig; no Cyclone
      # DDS installation needed.  `zig build interop-test` works on all platforms.

      - name: Interop tests
        run: zig build interop-test

      # ── MicroZig-facing XRCE codegen ─────────────────────────────────────
      # Keep the legacy XRCE consumer check until the Pico migration has
      # passed hardware validation. Also test default output with Zig 0.17.0.

      - name: Generate default XRCE fixture for Zig 0.17.0
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build run -- -b zig --profile xrce -o test/xrce-microzig/generated test/xrce-microzig/types.idl
          zig build run -- -b zig -o test/xrce-microzig/generated test/xrce-microzig/allocations.idl

      - name: Test XRCE fixture on Zig 0.17.0
        if: matrix.os == 'ubuntu-latest'
        run: zig build test
        working-directory: test/xrce-microzig

      - name: Generate legacy XRCE fixture
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build run -- -b zig --profile xrce --zig-version 0.15.1 -o test/xrce-microzig/generated test/xrce-microzig/types.idl
          zig build run -- -b zig --zig-version 0.15.1 -o test/xrce-microzig/generated test/xrce-microzig/allocations.idl

      - name: Install Zig 0.15.1
        if: matrix.os == 'ubuntu-latest'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.1"

      - name: Test legacy XRCE fixture
        if: matrix.os == 'ubuntu-latest'
        run: zig build test
        working-directory: test/xrce-microzig

  # ── Valgrind ──────────────────────────────────────────────────────────────

  valgrind:
    name: Valgrind (memcheck)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind

      - name: Build test binaries (main)
        run: zig build emit-tests -Doptimize=Debug -Dtarget=x86_64-linux-gnu

      - name: Build test binaries (zidl-rt)
        run: zig build emit-tests -Doptimize=Debug -Dtarget=x86_64-linux-gnu
        working-directory: packages/zidl-rt

      - name: Build test binaries (zidl-cdr)
        run: zig build emit-tests -Doptimize=Debug -Dtarget=x86_64-linux-gnu
        working-directory: packages/zidl-cdr

      - name: Run tests under Valgrind
        run: |
          set -e
          ERRORS=0
          for bin in \
            zig-out/tests/* \
            packages/zidl-rt/zig-out/tests/* \
            packages/zidl-cdr/zig-out/tests/*; do
            [ -x "$bin" ] || continue
            echo "=== valgrind: $(basename $bin) ==="
            VALOUT=$(mktemp)
            if ! valgrind \
                --error-exitcode=1 \
                --leak-check=full \
                --show-leak-kinds=definite,indirect \
                --errors-for-leak-kinds=definite,indirect \
                --track-origins=yes \
                --log-file="$VALOUT" \
                "$bin"; then
              echo "::error::Valgrind reported errors in $(basename $bin)"
              cat "$VALOUT"
              ERRORS=$((ERRORS + 1))
            fi
            rm -f "$VALOUT"
          done
          [ $ERRORS -eq 0 ]

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Builds all test binaries to zig-out/tests/ (and packages/*/zig-out/tests/),
  # uses LLVM debug information for kcov, collects the CLI and typesupport
  # loader hosts too, and uploads the merged cobertura.xml to Codecov.
  #
  # Gated on the full test matrix so coverage only uploads when the entire
  # suite is green.

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      # Ubuntu 24.04 has no kcov package. Build unmodified upstream kcov,
      # linked to the distribution's stock libdw; no elfutils patch is needed.
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: |
            /tmp/kcov-src
            /tmp/kcov-build
          key: kcov-v42-stock-libdw-ubuntu24-${{ runner.arch }}

      - name: Install coverage runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdw1t64 libcurl4t64

      - name: Build kcov against stock elfutils
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            binutils-dev libdw-dev libcurl4-openssl-dev \
            zlib1g-dev libiberty-dev cmake
          git clone --depth=1 --branch v42 https://github.com/SimonKagstrom/kcov.git /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build --parallel

      - name: Install kcov
        run: sudo install -m755 /tmp/kcov-build/src/kcov /usr/local/bin/kcov

      - name: Build test binaries (main)
        run: zig build emit-tests -Dcoverage=true

      - name: Build test binaries (zidl-rt)
        run: zig build emit-tests -Dcoverage=true
        working-directory: packages/zidl-rt

      - name: Build test binaries (zidl-cdr)
        run: zig build emit-tests -Dcoverage=true
        working-directory: packages/zidl-cdr

      - name: Run tests under kcov
        run: |
          set -euo pipefail
          collect() {
            kcov --include-path="$(pwd)/src,$(pwd)/packages" \
              --strip-path="$(pwd)" --exclude-line=unreachable,@panic coverage/ "$@"
          }
          for directory in zig-out/tests packages/zidl-rt/zig-out/tests packages/zidl-cdr/zig-out/tests; do
            # A missing suite is a collection failure, not an empty successful run.
            test -d "$directory"
            count=0
            for bin in "$directory"/*; do
              test -f "$bin"
              collect "$bin"
              count=$((count + 1))
            done
            test "$count" -gt 0
          done
          # Exercise the CLI's opt-in output path and the actual loadable providers.
          collect zig-out/bin/zidl -b zig --experimental-typesupport-library \
            -o "${RUNNER_TEMP}/coverage-generated" test/integration/typesupport_library/a.idl
          fixtures=zig-out/coverage-typesupport
          for host in ts-host ts-c-host; do
            collect "$fixtures/$host" "$fixtures/liba.so" "$fixtures/libb.so" "$fixtures/libconflict.so"
          done
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("coverage/kcov-merged/cobertura.xml").getroot()
          assert int(report.attrib["lines-valid"]) > 0, "kcov recorded no executable lines"
          assert int(report.attrib["lines-covered"]) > 0, "kcov recorded no executed lines"
          PY

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/kcov-merged/cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcov-coverage
          path: coverage/kcov-merged/
          retention-days: 14
